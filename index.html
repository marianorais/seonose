<!doctype html>
<html lang="es">
  <head>
  <meta charset="UTF-8" />
  <meta name="google-site-verification" content="AVBTazbMSQTSrxGLUuGGQVHojq_S0nHvhrVc1soObAc" />

  <!-- Favicons -->
  <link
    rel="icon"
    href="/favicon-32.png"
    type="image/png"
    sizes="32x32"
  />

  <link
    rel="icon"
    href="/icon.png"
    type="image/png"
    sizes="512x512"
  />

  <link
    rel="shortcut icon"
    href="/favicon.ico"
  />

  <link
    rel="apple-touch-icon"
    href="/apple-touch-icon.png"
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Poppins:wght@400;700&family=Roboto:wght@400;700&display=swap"
    rel="stylesheet"
  />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>SeoNoSe | Trivia diaria de cultura general</title>

  <meta name="description" content="Respondé un desafío nuevo todos los días con preguntas de historia, ciencia, geografía, deportes y cultura general." />

  <!--
    Dominio canónico: siempre con www (el apex redirige acá). Las URLs con
    otros parámetros (?c=wa de los links compartidos, etc.) consolidan en esta.
    Las demás rutas lo actualizan desde `CanonicalRuta`.
  -->
  <link rel="canonical" href="https://www.seonose.com.ar/" />

  <!-- Open Graph -->
  <meta
    property="og:title"
    content="🧠 Se o NoSe - ¿Cuánto sabés realmente?"
  />

  <meta
    property="og:description"
    content="Nuevas preguntas todos los días. ¿Cuántas podés acertar?"
  />

  <!-- Con www: el apex responde con una redirección y algunos lectores de previews no la siguen. -->
  <meta
    property="og:image"
    content="https://www.seonose.com.ar/logo.jpg"
  />

  <meta
    property="og:image:width"
    content="1280"
  />

  <meta
    property="og:image:height"
    content="698"
  />

  <meta
    property="og:image:type"
    content="image/jpeg"
  />

  <meta
    property="og:url"
    content="https://www.seonose.com.ar/"
  />

  <meta
    property="og:type"
    content="website"
  />

  <meta
    property="og:site_name"
    content="Se o NoSe"
  />

  <meta
    property="og:locale"
    content="es_AR"
  />

  <!-- Datos estructurados: le dicen a Google qué es el sitio y cómo se llama. -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Se o NoSe",
      "alternateName": ["SEoNOSE", "SeoNoSe"],
      "url": "https://www.seonose.com.ar/",
      "inLanguage": "es-AR",
      "description": "Trivia diaria de cultura general: un desafío nuevo de preguntas todos los días."
    }
  </script>

  <!-- Twitter / X -->
  <meta
    name="twitter:card"
    content="summary_large_image"
  />

  <meta
    name="twitter:title"
    content="🧠 Se o NoSe - ¿Cuánto sabés realmente?"
  />

  <meta
    name="twitter:description"
    content="Nuevas preguntas todos los días. ¿Cuántas podés acertar?"
  />

  <meta
    name="twitter:image"
    content="https://www.seonose.com.ar/logo.jpg"
  />
</head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
